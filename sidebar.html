<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>MiniStylus</title>
<style>
/* Ciemne tło i podstawowe kolory */
body {
  font-family: "Segoe UI", Tahoma, sans-serif;
  padding: 15px;
  background: #121212;
  color: #e5e7eb;
  width: 100%;
  box-sizing: border-box;
}

/* Textarea z ciemnym tłem */
textarea {
  width: 100%;
  height: 200px;
  resize: none;
  box-sizing: border-box;
  padding: 12px 15px;
  font-family: "Courier New", Courier, monospace;
  font-size: 14px;
  border: 1.5px solid #2d2d2d;
  border-radius: 8px;
  background: #1e1e1e;
  color: #f8fafc;
  transition: border-color 0.3s ease;
}

textarea:focus {
  outline: none;
  border-color: #4f46e5;
  box-shadow: 0 0 4px rgba(79, 70, 229, 0.5);
}

/* Flat button style */
button#saveBtn,
button#clearBtn,
button#magicWandBtn,
button#destroyerBtn {
  width: 40px;
  height: 40px;
  padding: 0;
  font-size: 18px;
  border-radius: 8px;
  text-align: center;
  display: inline-block;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background-color 0.2s ease, transform 0.1s ease;
  border: none;
  margin-top: 10px;
  outline: none;
}

/* Save = niebieski */
#saveBtn {
  background-color: #34da34; /* flat niebieski */
  color: white;
}

#saveBtn:hover {
  background-color: #45c51e;
}

#saveBtn:active {
  background-color: #2bbb18;
  transform: scale(0.97);
}

/* Clear = czerwony */
#clearBtn {
  background-color: #ef4444;
  color: white;
}

#clearBtn:hover {
  background-color: #dc2626;
}

#clearBtn:active {
  background-color: #b91c1c;
  transform: scale(0.97);
}
/* Clear = czerwony */
#magicWandBtn {
  background-color: #2229f5;
  color: white;
}

#magicWandBtn:hover {
  background-color: #1e24e4;
}

#magicWandBtn:active {
  background-color: #1a20d3;
  transform: scale(0.97);
}

/* Ikony SVG w przyciskach */
button svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  fill: none;
}
/* Status */
#status {
  margin-top: 10px;
  font-size: 13px;
  color: #38bdf8; /* niebieski status */
  min-height: 18px;
  user-select: text;
}

/* Toggle container */
.toggle-container {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 15px;
}
#destroyerBtn {
  background-color: #ef4444;
  color: white;
}
#destroyerBtn:hover {
  background-color: #dc2626;
}

#destroyerBtn:active {
  background-color: #b91c1c;
  transform: scale(0.97);
}

/* Ikona w przycisku */
#destroyerBtn svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  fill: none;
}

  </style>
</head>
<body>
<button id="openEditorBtn">Otwórz edytor stylów</button>
<br />
<textarea id="cssBox" placeholder="Wpisz CSS tutaj..."></textarea>

<button id="destroyerBtn" title="Tryb Destroyer (wybierz selektor)">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shredder-icon lucide-shredder"><path d="M10 22v-5"/><path d="M14 19v-2"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M18 20v-3"/><path d="M2 13h20"/><path d="M20 13V7l-5-5H6a2 2 0 0 0-2 2v9"/><path d="M6 20v-3"/></svg>
</button>

<button id="magicWandBtn" title="Tryb usuwania (kliknij element)">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-wand-sparkles-icon lucide-wand-sparkles"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg> 
</button>


<button id="saveBtn" title="Zapisz styl">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-save-icon lucide-save"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
</button>

<button id="clearBtn" title="Usuń styl">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2-icon lucide-trash-2"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
</button>

  <script src="sidebar.js"></script>
  <script src="options.js"></script>
</body>
</html>
