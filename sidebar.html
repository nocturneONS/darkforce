<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>myStyles</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      padding: 16px;
      background: #121212;
      color: #e5e7eb;
      width: 100%;
      box-sizing: border-box;
    }

    #cssBox {
      width: 100%;
      height: 300px;
      resize: none;
      padding: 12px 15px;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      border: 1.5px solid #2d2d2d;
      border-radius: 8px;
      background: #1e1e1e;
      color: #f8fafc;
      transition: border-color 0.3s ease;
      box-sizing: border-box;
    }

    #cssBox:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 4px rgba(79, 70, 229, 0.5);
    }

    .button-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0;
    }

    .toolbar-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .toolbar-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }
    #saveBtn:active {
      transform: scale(0.97);
    }

#destroyerBtn {
  background-color: #ef4444;
  color: white;
}
#destroyerBtn:hover {
  background-color: #dc2626;
}
#destroyerBtn:active {
  background-color: #b91c1c;
  transform: scale(0.97);
}

#magicWandBtn {
  background-color: #5b5bd6;
  color: white;
}
#magicWandBtn:hover {
  background-color: #4848c9;
}
#magicWandBtn:active {
  background-color: #3d3db3;
  transform: scale(0.97);
}

#saveBtn {
  background-color: #16a34a;
  color: white;
}
#saveBtn:hover {
  background-color: #15803d;
}
#saveBtn:active {
  background-color: #166534;
  transform: scale(0.97);
}

#clearBtn {
  background-color: #4b5563;
  color: white;
}
#clearBtn:hover {
  background-color: #374151;
}
#clearBtn:active {
  background-color: #1f2937;
  transform: scale(0.97);
}

#openEditorBtn {
  background-color: #3b82f6;
  color: white;
}
#openEditorBtn:hover {
  background-color: #2563eb;
}
#openEditorBtn:active {
  background-color: #1d4ed8;
  transform: scale(0.98);
}


    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #38bdf8;
      min-height: 18px;
      user-select: text;
    }
  </style>
</head>
<body>

  <textarea id="cssBox" placeholder="np. body { color: white; }"></textarea>

  <div class="button-toolbar">
        <button id="saveBtn" class="toolbar-btn" title="Zapisz styl">
      <!-- Ikona zapisu -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
    </button>

    <button id="clearBtn" class="toolbar-btn" title="Wyczyść styl">
      <!-- Ikona kosza -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    </button>
        <button id="magicWandBtn" class="toolbar-btn" title="Magic Wand (zaznacz)">
      <!-- Ikona różdżki -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg>
    </button>
    <button id="destroyerBtn" class="toolbar-btn" title="Destroyer (usuń)">
      <!-- Ikona niszczyciela -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eraser-icon lucide-eraser"><path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21"/><path d="m5.082 11.09 8.828 8.828"/></svg>
    </button>
      <button id="openEditorBtn" class="toolbar-btn" title="Edytor styli">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-icon lucide-settings"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
  </div>

  <div id="status"></div>

  <script src="sidebar.js"></script>
</body>
</html>
